<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .recording-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Voice Agent</h1>
            <p class="text-gray-600">Talk to your AI assistant</p>
        </header>

        <div class="max-w-md mx-auto bg-white rounded-lg shadow-md overflow-hidden">
            <!-- Chat Display -->
            <div id="chatDisplay" class="p-4 h-80 overflow-y-auto">
                <div class="flex flex-col space-y-4">
                    <div class="flex items-start">
                        <div class="bg-blue-100 rounded-lg p-3 max-w-xs">
                            <p class="text-sm">Hello! I'm your voice assistant. How can I help you today?</p>
                        </div>
                    </div>
                    <!-- Messages will be added here dynamically -->
                </div>
            </div>

            <!-- Controls -->
            <div class="border-t border-gray-200 p-4">
                <div class="flex items-center">
                    <input
                        id="textInput"
                        type="text"
                        placeholder="Type a message..."
                        class="flex-1 border border-gray-300 rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                    <button
                        id="sendButton"
                        class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    >
                        Send
                    </button>
                </div>

                <div class="flex justify-center mt-4">
                    <button
                        id="recordButton"
                        class="bg-red-500 text-white rounded-full w-16 h-16 flex items-center justify-center hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-4 text-center text-sm text-gray-500">
            <p>Click the microphone button to start recording, or type your message and press send.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatDisplay = document.getElementById('chatDisplay');
            const textInput = document.getElementById('textInput');
            const sendButton = document.getElementById('sendButton');
            const recordButton = document.getElementById('recordButton');

            let mediaRecorder;
            let audioChunks = [];
            let isRecording = false;

            // Add a message to the chat display
            function addMessage(text, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'flex items-start ' + (isUser ? 'justify-end' : '');

                const messageContent = document.createElement('div');
                messageContent.className = isUser
                    ? 'bg-blue-500 text-white rounded-lg p-3 max-w-xs'
                    : 'bg-blue-100 rounded-lg p-3 max-w-xs';

                const messagePara = document.createElement('p');
                messagePara.className = 'text-sm';
                messagePara.textContent = text;

                messageContent.appendChild(messagePara);
                messageDiv.appendChild(messageContent);
                chatDisplay.querySelector('.flex-col').appendChild(messageDiv);

                // Scroll to bottom
                chatDisplay.scrollTop = chatDisplay.scrollHeight;
            }

            // Send a text message
            async function sendTextMessage(text) {
                if (!text.trim()) return;

                // Add user message to chat
                addMessage(text, true);

                try {
                    // Send message to the agent
                    const response = await fetch('/api/agent/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: text,
                            context: { generateSpeech: true }
                        })
                    });

                    const data = await response.json();

                    // Add agent response to chat
                    addMessage(data.text);

                    // Play audio if available
                    if (data.audioUrl) {
                        console.log('Playing audio response');
                        const audio = new Audio(data.audioUrl);
                        audio.play().catch(error => {
                            console.error('Error playing audio:', error);
                        });
                    }
                } catch (error) {
                    console.error('Error sending message:', error);
                    addMessage('Sorry, I encountered an error processing your request.');
                }
            }

            // Handle send button click
            sendButton.addEventListener('click', () => {
                const text = textInput.value;
                sendTextMessage(text);
                textInput.value = '';
            });

            // Handle enter key in text input
            textInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const text = textInput.value;
                    sendTextMessage(text);
                    textInput.value = '';
                }
            });

            // Handle record button click
            recordButton.addEventListener('click', async () => {
                if (isRecording) {
                    // Stop recording
                    mediaRecorder.stop();
                    recordButton.classList.remove('recording-pulse');
                    recordButton.classList.remove('bg-red-600');
                    recordButton.classList.add('bg-red-500');
                    isRecording = false;
                } else {
                    // Start recording
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        mediaRecorder = new MediaRecorder(stream);
                        audioChunks = [];

                        mediaRecorder.addEventListener('dataavailable', (event) => {
                            audioChunks.push(event.data);
                        });

                        mediaRecorder.addEventListener('stop', async () => {
                            // Create audio blob
                            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });

                            // Create form data
                            const formData = new FormData();
                            formData.append('audio', audioBlob);

                            try {
                                // Transcribe audio
                                const transcribeResponse = await fetch('/api/transcribe', {
                                    method: 'POST',
                                    body: formData
                                });

                                const transcribeData = await transcribeResponse.json();

                                if (transcribeData.text) {
                                    // Add transcription to chat
                                    addMessage(transcribeData.text, true);

                                    // Process with agent
                                    const agentResponse = await fetch('/api/agent/voice', {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json'
                                        },
                                        body: JSON.stringify({
                                            transcription: transcribeData.text,
                                            context: { generateSpeech: true }
                                        })
                                    });

                                    const agentData = await agentResponse.json();

                                    // Add agent response to chat
                                    addMessage(agentData.text);

                                    // Play audio if available
                                    if (agentData.audioUrl) {
                                        console.log('Playing audio response');
                                        const audio = new Audio(agentData.audioUrl);
                                        audio.play().catch(error => {
                                            console.error('Error playing audio:', error);
                                        });
                                    }
                                } else {
                                    addMessage("I couldn't understand what you said. Please try again.");
                                }
                            } catch (error) {
                                console.error('Error processing voice:', error);
                                addMessage('Sorry, I encountered an error processing your voice input.');
                            }

                            // Stop all tracks
                            stream.getTracks().forEach(track => track.stop());
                        });

                        // Start recording
                        mediaRecorder.start();
                        recordButton.classList.add('recording-pulse');
                        recordButton.classList.remove('bg-red-500');
                        recordButton.classList.add('bg-red-600');
                        isRecording = true;
                    } catch (error) {
                        console.error('Error accessing microphone:', error);
                        addMessage('Error accessing microphone. Please make sure you have granted permission to use the microphone.');
                    }
                }
            });
        });
    </script>
</body>
</html>
